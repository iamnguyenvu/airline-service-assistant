spring.application.name=airline-service-assistant

# Server Configuration
server.port=8080
server.compression.enabled=true

# Database Configuration (Supabase or Local)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/airline_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# Spring AI - Vertex AI Gemini Configuration (Production)
# Uses Google AI Studio API key (FREE tier: 15 RPM, 1M TPM, 1500 RPD)
spring.ai.vertex-ai.gemini.project-id=${GEMINI_PROJECT_ID:}
spring.ai.vertex-ai.gemini.location=${GEMINI_LOCATION:us-central1}
spring.ai.vertex-ai.gemini.chat.options.model=${GEMINI_MODEL:gemini-1.5-flash}
spring.ai.vertex-ai.gemini.chat.options.temperature=0.7

# Spring AI - Ollama Configuration (Development & Embeddings)
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:llama3.1:8b}
spring.ai.ollama.chat.options.temperature=0.7
spring.ai.ollama.chat.options.num-ctx=4096
spring.ai.ollama.embedding.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

# Spring AI - PGVector Configuration
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=384

# OAuth2 Resource Server (Supabase)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_JWT_ISSUER:https://your-project.supabase.co/auth/v1}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URI:https://your-project.supabase.co/auth/v1/jwks}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# OpenAPI Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Active Spring Profile (dev or prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Logging
logging.level.root=INFO
logging.level.io.github.nguyenvu=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Application Specific
app.flight.snapshot.retention-days=90
app.flight.cache.ttl-seconds=120
app.booking.pdf.storage-path=${SUPABASE_STORAGE_URL:}
app.policy.storage-path=${SUPABASE_STORAGE_URL:}
