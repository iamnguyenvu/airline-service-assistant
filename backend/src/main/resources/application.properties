spring.application.name=airline-service-assistant

# Server Configuration
server.port=8080
server.compression.enabled=true

# Database Configuration (Supabase or Local)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# Note: If you get checksum mismatch error for V10, run the SQL script:
# backend/scripts/repair_flyway_v10.sql
# Or manually: UPDATE flyway_schema_history SET checksum = 287909867 WHERE version = '10';

# Redis Configuration
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=2000ms

# Google Generative AI (Google AI Studio - 100% FREE, no billing required)
# Get API key from: https://aistudio.google.com/app/apikey
# Free tier: 15 RPM, 1M TPM, 1.5k RPD
# Spring AI 1.1.0-RC1: Direct support for Google AI Studio API key
# When api-key is provided, uses Gemini Developer API (no project-id needed)
# Priority: Google GenAI (Gemini) > Ollama (fallback only)
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-2.0-flash}
spring.ai.google.genai.chat.options.temperature=0.7
spring.ai.google.genai.chat.options.max-output-tokens=2048
spring.ai.google.genai.chat.options.top-p=0.95
spring.ai.google.genai.chat.options.top-k=40

# Ollama Configuration
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:llama3.1:8b}
spring.ai.ollama.chat.options.temperature=0.7
spring.ai.ollama.chat.options.num-ctx=4096
spring.ai.ollama.embedding.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

# PGVector Configuration
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768

# OAuth2 Resource Server (Supabase)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_JWT_ISSUER:https://your-project.supabase.co/auth/v1}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URI:https://your-project.supabase.co/auth/v1/jwks}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.appoptics.metrics.export.enabled=true

# OpenAPI Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Active Spring Profile (dev or prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Logging
logging.level.root=INFO
logging.level.io.github.nguyenvu=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Debug logs for pgvector troubleshooting
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.ai.vectorstore=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG

# Application Specific
app.flight.snapshot.retention-days=90
app.flight.cache.ttl-seconds=120
app.policy.storage-path=${SUPABASE_STORAGE_URL:}
spring.task.scheduling.enabled=true
app.ingestion.enabled=false
app.ingestion.provider=amadeus
app.ingestion.cron=0 15 2 * * *
app.ingestion.routes=SGN-HAN,SGN-DAD,HAN-DAD
app.ingestion.aviationstack.api-key=${AVIATIONSTACK_API_KEY:}
app.ingestion.aviationstack.base-url=${AVIATIONSTACK_BASE_URL:https://api.aviationstack.com/v1}
app.ingestion.amadeus.client-id=${AMADEUS_CLIENT_ID:}
app.ingestion.amadeus.client-secret=${AMADEUS_CLIENT_SECRET:}
app.ingestion.amadeus.base-url=${AMADEUS_BASE_URL:https://test.api.amadeus.com}
app.policy.crawler.vna.allowlist=${VNA_POLICY_ALLOWLIST:}


