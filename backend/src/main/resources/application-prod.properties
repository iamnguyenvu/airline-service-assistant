# Production Profile

# Database Configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# Google Generative AI (Google AI Studio - FREE, no billing required)
# Spring AI 1.1.0-RC1: Direct support for Google AI Studio API key
spring.ai.model.chat=google-genai
spring.ai.ollama.chat.enabled=false

# Enable flight ingestion in production
app.ingestion.enabled=true
app.ingestion.provider=hybrid

# Enable rate limiting in production
app.rate-limit.enabled=true
app.rate-limit.requests-per-minute=30

# Logging (override base debug levels for production)
logging.level.root=INFO
logging.level.io.github.nguyenvu=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.springframework.ai=INFO
logging.level.org.springframework.jdbc=WARN

# JPA settings for production
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

# Actuator (restrict in production)
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health,info
