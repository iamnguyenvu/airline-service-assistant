# Development Profile

# Database Configuration (local Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/airline_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# Redis Configuration (local Docker)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

# Development: Prefer Google GenAI (Gemini) from Google AI Studio, fallback to Ollama
# Google AI Studio: 100% FREE, no billing, just API key from https://aistudio.google.com/app/apikey
# Priority: Google GenAI (if GEMINI_API_KEY set) > Ollama (fallback if no API key)
# Spring AI 1.1.0-RC1: Direct support for Google AI Studio API key
spring.ai.model.chat=google-genai
spring.ai.ollama.chat.enabled=true
