# Development Profile

# Database Configuration (local Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/airline_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# Redis Configuration (local Docker)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

# Exclude Vertex AI (use Ollama instead)
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.vertexai.gemini.VertexAiGeminiAutoConfiguration
spring.ai.ollama.chat.enabled=true
