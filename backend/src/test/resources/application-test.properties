# Test Profile Configuration
spring.application.name=airline-service-assistant-test

# Disable OAuth2 in tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

# Disable Redis in tests
spring.autoconfigure.exclude[1]=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# Disable Spring AI in tests (optional)
spring.ai.ollama.chat.enabled=false

# Logging
logging.level.root=WARN
logging.level.io.github.nguyenvu=INFO
logging.level.org.springframework.test=INFO
